# GitHub Action: generates a snake game animation from your contribution graph.
# Save this file as: .github/workflows/snake.yml  (inside your crtyydk-1/crtyydk-1 repo)

name: Generate Snake

# Runs automatically every 6 hours, and can also be triggered manually.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Required so the action can push the generated files back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: crtyydk-1
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
